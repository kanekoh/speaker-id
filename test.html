<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>話者識別テスト</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/score-charts.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">話者識別</div>
    <nav class="app-nav">
      <a href="/">登録</a>
      <a href="/test.html" aria-current="page">識別テスト</a>
      <a href="/scores.html">スコア</a>
    </nav>
    <button id="logoutBtn" class="btn btn-ghost btn-small">ログアウト</button>
  </header>

  <main class="page">
    <h1>話者識別テスト</h1>

    <section class="card">
      <h2>録音して識別する</h2>
      <p class="card-sub">1〜2秒以上、はっきり話してから止めてください。</p>
      <div class="actions">
        <button id="recordBtn" class="btn">🎙️ 録音開始</button>
        <button id="stopBtn" class="btn" disabled>⏹️ 録音終了</button>
        <button id="identifyBtn" class="btn btn-primary" disabled>🔍 確認</button>
      </div>
      <p id="result" class="status" role="status">状態: 待機中</p>
    </section>

    <section class="card viz-root" id="scoreSection" hidden>
      <h2>登録者ごとのスコア</h2>
      <p class="card-sub">今回の音声が各登録者とどれだけ似ていたか（コサイン類似度）。点線より右なら本人と判定。過去の結果は「スコア」画面で見られます。</p>
      <div id="scoreChart"></div>
    </section>
  </main>

  <script src="/static/auth.js"></script>
  <script src="/static/score-charts.js"></script>
  <script>
    let mediaRecorder;
    let recordedChunks = [];

    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const identifyBtn = document.getElementById("identifyBtn");
    const result = document.getElementById("result");

    // 状態表示（kind: "recording" | "ok" | "error" | なし）
    function setResult(text, kind) {
      result.textContent = text;
      result.className = "status" + (kind ? ` is-${kind}` : "");
    }

        // ページ初回認証
    window.onload = function() {
      Auth.ensureToken();
    };

    document.getElementById("logoutBtn").onclick = function() {
      Auth.logout();
    };

    recordBtn.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      recordedChunks = [];

      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        setResult("録音完了");
        identifyBtn.disabled = false;
      };

      mediaRecorder.start();
      setResult("● 録音中...", "recording");
      recordBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      recordBtn.disabled = false;
      stopBtn.disabled = true;
    };

    identifyBtn.onclick = async () => {
      const blob = new Blob(recordedChunks, { type: 'audio/wav' });
      const formData = new FormData();
      formData.append("audio", blob, "test.wav");
      formData.append("source", "test");

      setResult("識別中...");

      try {
        const res = await Auth.authFetch("/identify", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.reason === "too_short") {
          setResult(`声が短すぎます（${data.speech_sec}秒）。もう少し長く話してください`, "error");
        } else if (data.name) {
          setResult(`✓ 認識された人: ${data.kana}（スコア: ${data.score}）`, "ok");
        } else {
          setResult(data.candidate
            ? `✗ 識別できませんでした（最有力: ${data.candidate}、スコア: ${data.score}）`
            : "✗ 識別できませんでした", "error");
        }
        document.getElementById("scoreSection").hidden = !(data.scores && data.scores.length);
        if (data.scores && data.scores.length) {
          document.getElementById("scoreSection").hidden = false;
          ScoreCharts.renderBars(document.getElementById("scoreChart"), data.scores, data.threshold);
        }
      } catch (e) {
        console.error(e);
        setResult("エラーが発生しました", "error");
      }
    };
  </script>
</body>
</html>
