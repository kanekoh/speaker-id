<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>識別スコア</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/score-charts.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">話者識別</div>
    <nav class="app-nav">
      <a href="/">登録</a>
      <a href="/test.html">識別テスト</a>
      <a href="/scores.html" aria-current="page">スコア</a>
    </nav>
    <button id="logoutBtn" class="btn btn-ghost btn-small">ログアウト</button>
  </header>

  <main class="page">
    <h1>識別スコア</h1>

    <div class="actions">
      <button id="reloadBtn" class="btn">🔄 再読み込み</button>
      <label class="check"><input type="checkbox" id="autoReload" checked> 5秒ごとに自動更新</label>
      <button id="clearBtn" class="btn">🗑️ ログを消去</button>
    </div>

    <section class="card viz-root">
      <h2>最新の識別結果</h2>
      <p class="card-sub" id="latestSub"></p>
      <div id="latestChart"></div>
    </section>

    <section class="card viz-root">
      <h2>人ごとのスコア推移</h2>
      <p class="card-sub">直近50回の識別で、その人の登録音声とどれだけ似ていたか（コサイン類似度）。右ほど新しい。</p>
      <div id="multiples"></div>
    </section>

    <section class="card viz-root">
      <h2>ログ</h2>
      <p class="card-sub">サーバーのメモリ上に直近の記録だけを保持しています（再起動で消えます）。</p>
      <div id="logTable"></div>
    </section>
  </main>

  <script src="/static/auth.js"></script>
  <script src="/static/score-charts.js"></script>
  <script>
    const latestSub = document.getElementById("latestSub");
    let timer;

    async function load() {
      const res = await Auth.authFetch("/identify_log");
      if (!res.ok) return;
      const data = await res.json();

      const last = data.entries[data.entries.length - 1];
      if (last) {
        const kana = Object.fromEntries(data.people.map((p) => [p.name, p.kana]));
        const scores = Object.entries(last.scores)
          .map(([name, score]) => ({ name, kana: kana[name] || name, score }))
          .sort((a, b) => b.score - a.score);
        latestSub.textContent = `${last.time.replace("T", " ")}（${last.source}）: `
          + (last.result ? `✓ ${last.result} と判定`
             : last.reason === "too_short" ? "✗ 声が短すぎるため識別せず" : "✗ 該当なし")
          + (last.speech_sec != null ? `　声の長さ ${last.speech_sec}秒` : "")
          + `　閾値 ${data.threshold}`;
        if (scores.length) {
          ScoreCharts.renderBars(document.getElementById("latestChart"), scores, data.threshold);
        } else {
          document.getElementById("latestChart").replaceChildren();
        }
      } else {
        latestSub.textContent = "まだ識別の記録がありません";
        document.getElementById("latestChart").replaceChildren();
      }
      ScoreCharts.renderMultiples(document.getElementById("multiples"), data);
      ScoreCharts.renderTable(document.getElementById("logTable"), data);
    }

    function setAutoReload(on) {
      clearInterval(timer);
      if (on) timer = setInterval(load, 5000);
    }

    window.onload = function () {
      Auth.ensureToken(() => { load(); setAutoReload(true); });
    };
    document.getElementById("logoutBtn").onclick = () => Auth.logout();
    document.getElementById("reloadBtn").onclick = load;
    window.addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(load, 300); });
    document.getElementById("autoReload").onchange = (e) => setAutoReload(e.target.checked);
    document.getElementById("clearBtn").onclick = async () => {
      if (!confirm("識別ログを消去しますか？")) return;
      await Auth.authFetch("/identify_log", { method: "DELETE" });
      load();
    };
  </script>
</body>
</html>
