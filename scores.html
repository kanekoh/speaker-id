<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>識別スコア</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/score-charts.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">話者識別</div>
    <nav class="app-nav">
      <a href="/">登録</a>
      <a href="/test.html">識別テスト</a>
      <a href="/scores.html" aria-current="page">スコア</a>
    </nav>
    <button id="logoutBtn" class="btn btn-ghost btn-small">ログアウト</button>
  </header>

  <main class="page">
    <h1>識別スコア</h1>

    <div class="actions">
      <button id="reloadBtn" class="btn">🔄 再読み込み</button>
      <label class="check"><input type="checkbox" id="autoReload" checked> 5秒ごとに自動更新</label>
      <button id="clearBtn" class="btn">🗑️ ログを消去</button>
    </div>

    <section class="card viz-root">
      <h2>最新の識別結果</h2>
      <p class="card-sub" id="latestSub"></p>
      <div id="latestChart"></div>
    </section>

    <section class="card viz-root">
      <h2>人ごとのスコア推移</h2>
      <p class="card-sub">直近50回の識別で、その人の登録音声とどれだけ似ていたか（コサイン類似度）。右ほど新しい。</p>
      <div id="multiples"></div>
    </section>

    <section class="card viz-root">
      <h2>ログ</h2>
      <p class="card-sub">サーバーのメモリ上に直近の記録だけを保持しています（再起動で消えます）。録音は直近の数十件だけ再生できます。「元」は届いた音そのまま、「処理後」は無音を除いてモデルに入力した音です。SN比（声とノイズの大きさの差）が15dB未満の録音は ⚠ を付けています。</p>
      <div id="logTable"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="registerDialog" hidden>
    <form class="card modal" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
      <h2 id="registerTitle">この録音を登録に使う</h2>
      <p class="card-sub" id="registerInfo"></p>
      <div class="segmented" role="radiogroup" aria-label="登録のしかた">
        <label><input type="radio" name="regMode" value="add" id="regModeAdd" checked> 登録済みの人に追加</label>
        <label><input type="radio" name="regMode" value="new" id="regModeNew"> 新しい人を登録</label>
      </div>
      <div id="regAddFields" class="field">
        <label for="regPerson">誰の声か</label>
        <select id="regPerson"></select>
      </div>
      <div id="regNewFields" hidden>
        <div class="field">
          <label for="regName">識別名（半角英数字）</label>
          <input type="text" id="regName" placeholder="例: tanaka">
        </div>
        <div class="field">
          <label for="regKana">表示名</label>
          <input type="text" id="regKana" placeholder="例: たなかさん">
        </div>
      </div>
      <p class="status" id="registerStatus" role="status"></p>
      <div class="actions">
        <button type="button" class="btn" id="registerCancel">閉じる</button>
        <button type="submit" class="btn btn-primary" id="registerSubmit">登録する</button>
      </div>
    </form>
  </div>

  <script src="/static/auth.js"></script>
  <script src="/static/score-charts.js"></script>
  <script>
    const latestSub = document.getElementById("latestSub");
    let timer;

    async function load() {
      const res = await Auth.authFetch("/identify_log");
      if (!res.ok) return;
      const data = await res.json();
      latestPeople = data.people;

      const last = data.entries[data.entries.length - 1];
      if (last) {
        const kana = Object.fromEntries(data.people.map((p) => [p.name, p.kana]));
        const scores = Object.entries(last.scores)
          .map(([name, score]) => ({ name, kana: kana[name] || name, score }))
          .sort((a, b) => b.score - a.score);
        latestSub.textContent = `${last.time.replace("T", " ")}（${last.source}）: `
          + (last.result ? `✓ ${last.result} と判定`
             : last.reason === "too_short" ? "✗ 声が短すぎるため識別せず" : "✗ 該当なし")
          + (last.speech_sec != null ? `　声の長さ ${last.speech_sec}秒` : "")
          + `　閾値 ${data.threshold}`;
        if (scores.length) {
          ScoreCharts.renderBars(document.getElementById("latestChart"), scores, data.threshold);
        } else {
          document.getElementById("latestChart").replaceChildren();
        }
      } else {
        latestSub.textContent = "まだ識別の記録がありません";
        document.getElementById("latestChart").replaceChildren();
      }
      ScoreCharts.renderMultiples(document.getElementById("multiples"), data);
      ScoreCharts.renderTable(document.getElementById("logTable"), data, { renderActions });
    }

    // ---- 録音の再生 ----
    let player = null;
    let playingButton = null;

    function stopPlaying() {
      if (player) { player.pause(); URL.revokeObjectURL(player.src); }
      if (playingButton) playingButton.textContent = playingButton.dataset.label;
      player = null; playingButton = null;
    }

    async function play(entryId, kind, button) {
      const same = playingButton && playingButton.dataset.key === `${entryId}-${kind}`;
      stopPlaying();
      if (same) return;  // 再生中のボタンをもう一度押したら停止
      const res = await Auth.authFetch(`/identify_log/${entryId}/audio?kind=${kind}`);
      if (!res.ok) { alert(`再生できません (HTTP ${res.status})`); return; }
      player = new Audio(URL.createObjectURL(await res.blob()));
      playingButton = button;
      button.textContent = "■ 停止";
      player.onended = stopPlaying;
      player.play();
    }

    // ---- 録音を登録に使う ----
    const dialog = document.getElementById("registerDialog");
    const regModeAdd = document.getElementById("regModeAdd");
    const regPerson = document.getElementById("regPerson");
    const registerStatus = document.getElementById("registerStatus");
    let dialogEntry = null;
    let latestPeople = [];

    function setRegMode(mode) {
      document.getElementById(mode === "add" ? "regModeAdd" : "regModeNew").checked = true;
      document.getElementById("regAddFields").hidden = mode !== "add";
      document.getElementById("regNewFields").hidden = mode !== "new";
    }
    document.getElementById("regModeAdd").onchange = () => setRegMode("add");
    document.getElementById("regModeNew").onchange = () => setRegMode("new");

    function openRegisterDialog(entry) {
      dialogEntry = entry;
      const env = entry.source === "test" ? "ブラウザ" : "スタックチャン";
      document.getElementById("registerInfo").textContent =
        `${entry.time.replace("T", " ")}・送信元 ${entry.source}（${env}の録音として登録）・声の長さ ${entry.speech_sec ?? "–"}秒`;
      regPerson.replaceChildren(...latestPeople.map((p) => {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = `${p.kana}（${p.name}）`;
        return opt;
      }));
      // 判定結果（なければ最有力候補）を最初から選んでおく
      const guess = entry.result || entry.candidate;
      if (guess) regPerson.value = guess;
      regModeAdd.disabled = latestPeople.length === 0;
      setRegMode(latestPeople.length ? "add" : "new");
      registerStatus.textContent = "";
      registerStatus.className = "status";
      document.getElementById("registerSubmit").disabled = false;
      dialog.hidden = false;
    }

    document.getElementById("registerCancel").onclick = () => { dialog.hidden = true; };
    dialog.querySelector("form").onsubmit = async (e) => {
      e.preventDefault();
      const mode = regModeAdd.checked ? "add" : "new";
      const body = mode === "add"
        ? { mode, name: regPerson.value }
        : { mode, name: document.getElementById("regName").value.trim(),
            kana: document.getElementById("regKana").value.trim() };
      registerStatus.textContent = "登録中...";
      registerStatus.className = "status";
      const res = await Auth.authFetch(`/identify_log/${dialogEntry.id}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await res.json();
      if (res.ok) {
        let msg = `✓ ${result.kana}（${result.name}）に追加しました・${result.num_samples}件目`;
        if (result.consistency !== null) msg += `・既存の登録との一致度 ${result.consistency.toFixed(3)}`;
        registerStatus.textContent = msg;
        registerStatus.className = "status is-ok";
        document.getElementById("registerSubmit").disabled = true;
        load();
      } else {
        registerStatus.textContent = `✗ ${result.error || `HTTP ${res.status}`}`;
        registerStatus.className = "status is-error";
      }
    };

    function renderActions(entry) {
      if (!entry.has_audio) return null;
      const box = document.createElement("div");
      box.className = "row-actions";
      for (const [kind, label] of [["raw", "▶ 元"], ["processed", "▶ 処理後"]]) {
        const b = document.createElement("button");
        b.className = "btn btn-small";
        b.dataset.label = label;
        b.dataset.key = `${entry.id}-${kind}`;
        // 自動更新で表が作り直されても、再生中の表示を保つ
        b.textContent = playingButton && playingButton.dataset.key === b.dataset.key ? "■ 停止" : label;
        if (playingButton && playingButton.dataset.key === b.dataset.key) playingButton = b;
        b.onclick = () => play(entry.id, kind, b);
        box.appendChild(b);
      }
      if (entry.registered_to) {
        const done = document.createElement("span");
        done.className = "badge";
        done.textContent = `登録済み: ${entry.registered_to}`;
        box.appendChild(done);
      } else {
        const reg = document.createElement("button");
        reg.className = "btn btn-small";
        reg.textContent = "登録…";
        reg.onclick = () => openRegisterDialog(entry);
        box.appendChild(reg);
      }
      return box;
    }

    function setAutoReload(on) {
      clearInterval(timer);
      if (on) timer = setInterval(load, 5000);
    }

    window.onload = function () {
      Auth.ensureToken(() => { load(); setAutoReload(true); });
    };
    document.getElementById("logoutBtn").onclick = () => Auth.logout();
    document.getElementById("reloadBtn").onclick = load;
    window.addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(load, 300); });
    document.getElementById("autoReload").onchange = (e) => setAutoReload(e.target.checked);
    document.getElementById("clearBtn").onclick = async () => {
      if (!confirm("識別ログを消去しますか？")) return;
      await Auth.authFetch("/identify_log", { method: "DELETE" });
      load();
    };
  </script>
</body>
</html>
