<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>話者登録</title>
  <style>
    body { font-family: sans-serif; padding: 2em; background: #f2f2f2; }
    h1 { color: #333; }
    label, input, button { display: block; margin: 1em 0; }
    #status { margin-top: 1em; font-weight: bold; }
    .hint { color: #555; font-size: 0.9em; }
    #profileList { border-collapse: collapse; margin: 0.5em 0 1.5em; background: #fff; }
    #profileList th, #profileList td { border-bottom: 1px solid #ddd; padding: 4px 10px; text-align: left; }
    #profileList td.num { text-align: right; font-variant-numeric: tabular-nums; }
    #profileList button { display: inline; margin: 0; }
    .low { color: #c8312f; font-weight: bold; }
  </style>
</head>
<body>
  <h1>話者登録</h1>

  <label for="nameInput">識別名（半角英数字）:</label>
  <input type="text" id="nameInput" placeholder="例: tanaka">

  <label for="kanaInput">表示名（ひらがなや漢字など）:</label>
  <input type="text" id="kanaInput" placeholder="例: たなかさん">

  <button id="recordButton">🎙️ 録音開始</button>

  <p>以下の文を読み上げてください：</p>
  <p id="sampleText">こんにちは。私は〇〇です。スタックチャンに声を登録します。よろしくお願いします。</p>

  <button id="stopButton" disabled>⏹️ 録音終了</button>
  <button id="uploadButton" disabled>⬆️ 登録して送信</button>

  <p id="status">状態: 待機中</p>
  <p class="hint">同じ識別名で何回か登録すると、録音が追加されて精度が上がります（3〜5回、できれば日や時間帯を変えて）。</p>

  <h2>登録済みの話者</h2>
  <p class="hint">一致度は、その録音が同じ人の他の録音とどれだけ似ているかです。極端に低い録音（0.5未満）は、雑音や別人の声が入っている可能性があるので削除をおすすめします。</p>
  <div id="profiles">読み込み中...</div>

  <a href="/test.html">→ 話者識別テストへ</a>

  <!-- どこか分かりやすい場所に設置 -->
  <button id="logoutBtn">ログアウト</button>

  <script src="/static/auth.js"></script>
  <script>
    let mediaRecorder;
    let recordedChunks = [];


    // --- 録音・送信のロジック（認証ヘッダー付きで送信） ---
    const recordBtn = document.getElementById("recordButton");
    const stopBtn = document.getElementById("stopButton");
    const uploadBtn = document.getElementById("uploadButton");
    const status = document.getElementById("status");

    // --- 認証（auth.js） ---
    window.onload = function () {
      Auth.ensureToken(loadProfiles);
    };

    const fmtId = (id) => id.replace(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2}).*$/, "$1-$2-$3 $4:$5:$6");

    async function loadProfiles() {
      const box = document.getElementById("profiles");
      const res = await Auth.authFetch("/profiles");
      if (!res.ok) { box.textContent = "一覧を取得できませんでした"; return; }
      const { people } = await res.json();
      if (people.length === 0) { box.textContent = "まだ登録されていません"; return; }

      const table = document.createElement("table");
      table.id = "profileList";
      table.innerHTML = "<thead><tr><th>話者</th><th>録音日時</th><th>一致度</th><th></th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const p of people) {
        p.samples.forEach((sample, i) => {
          const tr = document.createElement("tr");
          const who = document.createElement("td");
          if (i === 0) {
            who.rowSpan = p.samples.length;
            who.textContent = `${p.kana}（${p.name}）・${p.samples.length}件 `;
            const delAll = document.createElement("button");
            delAll.textContent = "全削除";
            delAll.onclick = () => remove(`/profiles/${encodeURIComponent(p.name)}`,
              `${p.kana} さんの登録をすべて削除しますか？`);
            who.appendChild(delAll);
            tr.appendChild(who);
          }
          const when = document.createElement("td");
          when.textContent = fmtId(sample.id);
          const score = document.createElement("td");
          score.className = "num" + (sample.consistency !== null && sample.consistency < 0.5 ? " low" : "");
          score.textContent = sample.consistency === null ? "–" : sample.consistency.toFixed(3);
          const action = document.createElement("td");
          const del = document.createElement("button");
          del.textContent = "削除";
          del.onclick = () => remove(
            `/profiles/${encodeURIComponent(p.name)}/samples/${encodeURIComponent(sample.id)}`,
            `${fmtId(sample.id)} の録音を削除しますか？`);
          action.appendChild(del);
          tr.append(when, score, action);
          tbody.appendChild(tr);
        });
      }
      table.appendChild(tbody);
      box.replaceChildren(table);
    }

    async function remove(url, message) {
      if (!confirm(message)) return;
      const res = await Auth.authFetch(url, { method: "DELETE" });
      if (!res.ok) alert(`削除に失敗しました (HTTP ${res.status})`);
      loadProfiles();
    }

    document.getElementById("logoutBtn").onclick = function() {
      Auth.logout();
      // location.reload(); // 必要に応じて有効化
    };

    recordBtn.onclick = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = "エラー: マイクAPIが使用できません（HTTPSまたはlocalhostが必要です）";
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        status.textContent = `エラー: マイクへのアクセス失敗 - ${e.name}: ${e.message}`;
        return;
      }
      mediaRecorder = new MediaRecorder(stream);
      recordedChunks = [];

      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        status.textContent = "録音終了";
        uploadBtn.disabled = false;
      };

      mediaRecorder.start();
      status.textContent = "録音中...";
      recordBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      recordBtn.disabled = false;
      stopBtn.disabled = true;
    };

    uploadBtn.onclick = async () => {
      const name = document.getElementById("nameInput").value.trim();
      const kana = document.getElementById("kanaInput").value.trim();

      if (!name) {
        alert("識別名を入力してください");
        return;
      }

      const blob = new Blob(recordedChunks, { type: 'audio/wav' });
      const formData = new FormData();
      formData.append("audio", blob, name + ".wav");
      formData.append("name", name);
      formData.append("kana", kana);

      status.textContent = "送信中...";
      try {
        const res = await Auth.authFetch("/register", {
          method: "POST",
          body: formData
        });
        const result = await res.json();
        if (res.ok) {
          let msg = `登録成功: ${result.kana}（ID: ${result.name}）・${result.num_samples}件目`;
          if (result.consistency !== null) {
            msg += `、既存の録音との一致度 ${result.consistency.toFixed(3)}`;
            if (result.consistency < 0.5) msg += "（低め：録り直しを検討してください）";
          }
          status.textContent = msg;
          loadProfiles();
        } else {
          status.textContent = `エラー (HTTP ${res.status}): ${result.error || JSON.stringify(result)}`;
        }
      } catch (e) {
        console.error(e);
        status.textContent = `エラー発生: ${e.message}`;
      }
    };
  </script>
</body>
</html>
