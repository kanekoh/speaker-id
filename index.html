<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>話者登録</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">話者識別</div>
    <nav class="app-nav">
      <a href="/" aria-current="page">登録</a>
      <a href="/test.html">識別テスト</a>
      <a href="/scores.html">スコア</a>
    </nav>
    <button id="logoutBtn" class="btn btn-ghost btn-small">ログアウト</button>
  </header>

  <main class="page">
    <h1>話者登録</h1>

    <section class="card">
      <h2>声を登録する</h2>
      <p class="card-sub">1人につき3〜5回録音すると精度が上がります（できれば日や時間帯を変えて）。</p>

      <div class="segmented" role="radiogroup" aria-label="登録のしかた">
        <label><input type="radio" name="mode" value="add" id="modeAdd"> 登録済みの人に追加</label>
        <label><input type="radio" name="mode" value="new" id="modeNew"> 新しい人を登録</label>
      </div>

      <div id="addFields">
        <div class="field">
          <label for="personSelect">録音を追加する人</label>
          <select id="personSelect"></select>
        </div>
      </div>

      <div id="newFields" hidden>
        <div class="field">
          <label for="nameInput">識別名（半角英数字）</label>
          <input type="text" id="nameInput" placeholder="例: tanaka">
        </div>
        <div class="field">
          <label for="kanaInput">表示名（ひらがなや漢字など）</label>
          <input type="text" id="kanaInput" placeholder="例: たなかさん">
        </div>
      </div>

      <p class="hint">以下の文を、スタックチャンに話しかけるくらいの自然な声で読んでください。録音ごとに違う文が出ます（静かな場所で、普段使うときと同じくらいの距離から）。</p>
      <div class="read-aloud">
        <div class="read-aloud-head">
          <span id="sampleLabel"></span>
          <button type="button" id="nextTextBtn" class="btn btn-ghost btn-small">↻ 別の文にする</button>
        </div>
        <p id="sampleText"></p>
      </div>

      <div class="actions">
        <button id="recordButton" class="btn">🎙️ 録音開始</button>
        <button id="stopButton" class="btn" disabled>⏹️ 録音終了</button>
        <button id="uploadButton" class="btn btn-primary" disabled>⬆️ 登録して送信</button>
      </div>
      <p id="status" class="status" role="status">状態: 待機中</p>
    </section>

    <section class="card">
      <h2>登録済みの話者</h2>
      <p class="card-sub">一致度は、その録音が同じ人・同じ録音環境の他の録音とどれだけ似ているかです。極端に低い録音（0.5未満）は、雑音や別人の声が入っている可能性があるので削除をおすすめします。スタックチャンのマイクの録音は、スコア画面のログから登録できます。</p>
      <div id="profiles" class="empty">読み込み中...</div>
    </section>
  </main>

  <script src="/static/auth.js"></script>
  <script>
    let mediaRecorder;
    let recordedChunks = [];


    // --- 録音・送信のロジック（認証ヘッダー付きで送信） ---
    const recordBtn = document.getElementById("recordButton");
    const stopBtn = document.getElementById("stopButton");
    const uploadBtn = document.getElementById("uploadButton");
    const status = document.getElementById("status");

    // 状態表示（kind: "recording" | "ok" | "error" | なし）
    function setStatus(text, kind) {
      status.textContent = text;
      status.className = "status" + (kind ? ` is-${kind}` : "");
    }

    // --- 認証（auth.js） ---
    window.onload = function () {
      Auth.ensureToken(loadProfiles);
    };

    // --- 登録のしかた（登録済みの人に追加 / 新しい人を登録） ---
    const modeAdd = document.getElementById("modeAdd");
    const modeNew = document.getElementById("modeNew");
    const personSelect = document.getElementById("personSelect");
    let people = [];
    let modeChosen = false;  // 初回読み込み時だけ既定のモードを決める

    function setMode(mode, name) {
      modeChosen = true;
      (mode === "add" ? modeAdd : modeNew).checked = true;
      document.getElementById("addFields").hidden = mode !== "add";
      document.getElementById("newFields").hidden = mode !== "new";
      if (name) personSelect.value = name;
      chooseText();
    }
    modeAdd.onchange = () => setMode("add");
    modeNew.onchange = () => setMode("new");
    personSelect.onchange = () => chooseText();

    // --- 音読用の文 ---
    // 話す内容によらず声の特徴を見るモデルなので、いろいろな音（長音・撥音・促音・拗音・
    // 摩擦音など）と抑揚（問いかけ・呼びかけ・数字）を含む文を録音ごとに変えて読んでもらう
    const READ_TEXTS = [
      { label: "自己紹介", text: "こんにちは。私は〇〇です。スタックチャンに声を登録します。毎日話しかけるので、ちゃんと覚えてくださいね。" },
      { label: "問いかけ", text: "ねえ、スタックチャン。今日の天気はどう？ 午後から雨が降りそうなら、傘を持っていったほうがいいかな。" },
      { label: "ゆったり", text: "青い海と白い雲を眺めながら、冷たい麦茶をゆっくり飲みました。風が気持ちよくて、思わず大きな声で笑いました。" },
      { label: "小さい「っ」「ゃゅょ」", text: "明日の朝は、駅前の喫茶店でちょっと早めに待ち合わせしましょう。しっかり準備して、きっと楽しい旅行にしようね。" },
      { label: "数字", text: "目覚ましを六時四十五分にセットして。それから、三百二十八円の牛乳と、パンを二つ買うのを忘れないように教えてね。" },
      { label: "は行・ら行", text: "ふわふわのパンケーキに、はちみつとバターをたっぷりかけて、リビングでラジオを聞きながら、みんなで食べました。" },
      { label: "呼びかけ", text: "おーい、聞こえる？ 部屋の電気をつけて、音楽を少しだけ小さくしてくれる？ ありがとう、とても助かったよ！" },
      { label: "朗読", text: "むかしむかし、ある山のふもとに、やさしいおじいさんとおばあさんが、小さな犬と一緒に静かに暮らしていました。" },
    ];
    let textIndex = 0;

    function showText(i) {
      textIndex = (i + READ_TEXTS.length) % READ_TEXTS.length;
      const t = READ_TEXTS[textIndex];
      document.getElementById("sampleLabel").textContent = `文 ${textIndex + 1} / ${READ_TEXTS.length}・${t.label}`;
      document.getElementById("sampleText").textContent = t.text;
    }

    // 追加のときは、その人の登録件数に応じて次の文を出す（同じ文ばかりにならないように）
    function chooseText() {
      const person = modeAdd.checked && people.find((p) => p.name === personSelect.value);
      showText(person ? person.samples.length : 0);
    }
    document.getElementById("nextTextBtn").onclick = () => showText(textIndex + 1);

    function updatePersonSelect() {
      const current = personSelect.value;
      personSelect.replaceChildren(...people.map((p) => {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = `${p.kana}（${p.name}）・${p.samples.length}件`;
        return opt;
      }));
      if (people.some((p) => p.name === current)) personSelect.value = current;
      modeAdd.disabled = people.length === 0;
      if (people.length === 0) setMode("new");
      else if (!modeChosen) setMode("add");
      else chooseText();
    }

    const fmtId = (id) => id.replace(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2}).*$/, "$1-$2-$3 $4:$5:$6");

    async function loadProfiles() {
      const box = document.getElementById("profiles");
      const res = await Auth.authFetch("/profiles");
      if (!res.ok) { box.textContent = "一覧を取得できませんでした"; return; }
      ({ people } = await res.json());
      updatePersonSelect();
      if (people.length === 0) { box.textContent = "まだ登録されていません"; return; }
      box.className = "table-wrap";

      const table = document.createElement("table");
      table.className = "data-table";
      table.innerHTML = "<thead><tr><th>話者</th><th>録音日時</th><th>録音環境</th><th>一致度</th><th></th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const p of people) {
        p.samples.forEach((sample, i) => {
          const tr = document.createElement("tr");
          const who = document.createElement("td");
          if (i === 0) {
            who.rowSpan = p.samples.length;
            who.className = "wrap";
            who.textContent = `${p.kana}（${p.name}）・${p.samples.length}件 `;
            const delAll = document.createElement("button");
            delAll.className = "btn btn-small";
            delAll.textContent = "全削除";
            delAll.onclick = () => remove(`/profiles/${encodeURIComponent(p.name)}`,
              `${p.kana}（${p.name}）の登録をすべて削除しますか？`);
            const addMore = document.createElement("button");
            addMore.className = "btn btn-small";
            addMore.textContent = "＋録音を追加";
            addMore.onclick = () => {
              setMode("add", p.name);
              setStatus(`${p.kana}（${p.name}）の録音を追加します。「録音開始」を押してください`);
              document.querySelector(".card").scrollIntoView({ behavior: "smooth" });
            };
            const buttons = document.createElement("div");
            buttons.className = "row-actions";
            buttons.append(addMore, delAll);
            who.appendChild(buttons);
            tr.appendChild(who);
          }
          const when = document.createElement("td");
          when.textContent = fmtId(sample.id);
          const env = document.createElement("td");
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = sample.env === "device" ? "スタックチャン" : "ブラウザ";
          env.appendChild(badge);
          const score = document.createElement("td");
          score.className = "num" + (sample.consistency !== null && sample.consistency < 0.5 ? " low" : "");
          score.textContent = sample.consistency === null ? "–" : sample.consistency.toFixed(3);
          const action = document.createElement("td");
          const del = document.createElement("button");
          del.className = "btn btn-small";
          del.textContent = "削除";
          del.onclick = () => remove(
            `/profiles/${encodeURIComponent(p.name)}/samples/${encodeURIComponent(sample.id)}`,
            `${fmtId(sample.id)} の録音を削除しますか？`);
          action.appendChild(del);
          tr.append(when, env, score, action);
          tbody.appendChild(tr);
        });
      }
      table.appendChild(tbody);
      box.replaceChildren(table);
    }

    async function remove(url, message) {
      if (!confirm(message)) return;
      const res = await Auth.authFetch(url, { method: "DELETE" });
      if (!res.ok) alert(`削除に失敗しました (HTTP ${res.status})`);
      loadProfiles();
    }

    document.getElementById("logoutBtn").onclick = function() {
      Auth.logout();
    };

    recordBtn.onclick = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("エラー: マイクAPIが使用できません（HTTPSまたはlocalhostが必要です）", "error");
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus(`エラー: マイクへのアクセス失敗 - ${e.name}: ${e.message}`, "error");
        return;
      }
      mediaRecorder = new MediaRecorder(stream);
      recordedChunks = [];

      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        setStatus("録音終了");
        uploadBtn.disabled = false;
      };

      mediaRecorder.start();
      setStatus("● 録音中...", "recording");
      recordBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      recordBtn.disabled = false;
      stopBtn.disabled = true;
    };

    uploadBtn.onclick = async () => {
      const mode = modeAdd.checked ? "add" : "new";
      const name = mode === "add"
        ? personSelect.value
        : document.getElementById("nameInput").value.trim();
      const kana = mode === "add" ? "" : document.getElementById("kanaInput").value.trim();

      if (!name) {
        setStatus(mode === "add" ? "録音を追加する人を選んでください" : "識別名を入力してください", "error");
        return;
      }
      if (mode === "new" && people.some((p) => p.name === name)) {
        setStatus(`識別名「${name}」はすでに登録されています。この人に録音を足す場合は「登録済みの人に追加」を選んでください`, "error");
        return;
      }

      const blob = new Blob(recordedChunks, { type: 'audio/wav' });
      const formData = new FormData();
      formData.append("audio", blob, name + ".wav");
      formData.append("name", name);
      formData.append("kana", kana);
      formData.append("mode", mode);
      formData.append("env", "browser");

      setStatus("送信中...");
      try {
        const res = await Auth.authFetch("/register", {
          method: "POST",
          body: formData
        });
        const result = await res.json();
        if (res.ok) {
          let msg = `登録成功: ${result.kana}（ID: ${result.name}）・${result.num_samples}件目・声の長さ ${result.speech_sec}秒`;
          if (result.consistency !== null) {
            msg += `、既存の録音との一致度 ${result.consistency.toFixed(3)}`;
            if (result.consistency < 0.5) msg += "（低め：録り直しを検討してください）";
          }
          setStatus(msg, result.consistency !== null && result.consistency < 0.5 ? "error" : "ok");
          await loadProfiles();
          if (mode === "new") {
            // 続けて同じ人の 2 本目以降を録れるように「追加」に切り替える
            document.getElementById("nameInput").value = "";
            document.getElementById("kanaInput").value = "";
            setMode("add", name);
          }
          uploadBtn.disabled = true;
        } else {
          setStatus(`エラー (HTTP ${res.status}): ${result.error || JSON.stringify(result)}`, "error");
        }
      } catch (e) {
        console.error(e);
        setStatus(`エラー発生: ${e.message}`, "error");
      }
    };
  </script>
</body>
</html>
